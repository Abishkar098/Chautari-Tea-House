<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Menu QR | Chautari Tea House</title>
<meta name="robots" content="noindex">
<link rel="icon" href="images/logo.JPG">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--leaf:#A3B88C;--deep:#3F6B2B;--butter:#EFDDA9;--mist:#F7F9F6;--night:#1B2619}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;background:var(--mist);font:400 1.05rem/1.45 Inter,system-ui,sans-serif;color:#26302A;padding:1.5rem}
.card{width:min(100%,420px);background:#fff;border-radius:20px;padding:1.8rem 1.5rem 1.4rem;text-align:center;border:1px solid #E3E8E1}
img.logo{width:72px;height:72px;border-radius:16px;margin:0 auto .8rem}
h1{font-size:1.35rem;letter-spacing:-.01em}
.tag{color:var(--deep);font-weight:600;margin:.35rem 0 1rem}
h2{font-size:1.7rem;line-height:1.2;margin-bottom:.4rem}
p{margin-bottom:1rem}
.qr{width:min(100%,280px);margin:0 auto 1rem;background:var(--mist);border-radius:16px;padding:.6rem}
.qr img{width:100%;height:auto}
.url{font-weight:600;color:#000;word-break:break-all}
.actions{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin-top:1.1rem}
a,button{font:600 .95rem Inter,sans-serif;border-radius:12px;padding:.65rem 1.1rem;text-decoration:none;cursor:pointer}
button{background:#3F6B2B;color:#fff;border:0}
a{border:1px solid #cfd8cb;color:#0F1A12}
@media print{
  body{background:#fff;padding:0}
  .actions{display:none}
  .card{box-shadow:none}
}

*{-webkit-tap-highlight-color:transparent}
body{min-height:100svh;padding:max(1rem,env(safe-area-inset-top)) 1rem max(1rem,env(safe-area-inset-bottom))}
a,button{min-height:46px;display:inline-flex;align-items:center;justify-content:center}
.url{font-size:.95rem}
@media(max-width:480px){.card{padding:1.4rem 1.1rem}h2{font-size:1.45rem}.actions a,.actions button{flex:1 1 100%}}
@media print{@page{margin:12mm}body{min-height:auto;display:block}.card{border:0;margin:0 auto;max-width:380px}.qr{max-width:320px}}
</style>
</head>
<body>
<article class="card">
<img class="logo" src="images/logo.JPG" alt="Chautari Tea House">
<h1>Chautari Tea House</h1>
<p class="tag">Where every cup tells a story.</p>
<h2>Scan to see the menu</h2>
<p>Open your phone camera and point it at the code. Then tell your waiter what you would like.</p>
<div class="qr"><img src="images/menu-qr.svg" alt="QR code for the Chautari menu" width="280" height="280"></div>
<p class="url">chautariteahouse.com.np/menu.html</p>
<div class="actions">
<button type="button" onclick="print()">Print this card</button>
<a href="menu.html">Full menu</a>
</div>
</article>
</body>
</html>
