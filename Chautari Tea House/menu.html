<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Menu | Chautari Tea House</title>
<meta name="description" content="Tea, coffee, momos, fries and more at Chautari Tea House, NGO Road, Bharatpur.">
<meta name="theme-color" content="#ffffff">
<link rel="canonical" href="https://www.chautariteahouse.com.np/menu.html">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="images/icon-192.png">
<link rel="icon" href="images/logo.JPG">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--h:64px;--hs:52px;--brand:#3F6B2B;--brand-d:#2F5220;--brand-l:#EEF4E9;--ink:#0F1A12;--text:#44504A;--line:#E3E8E1;--soft:#F7F9F6;--amber:#F5E3A6;--r:14px}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font:400 1rem/1.5 Inter,system-ui,sans-serif;color:var(--text);background:var(--soft);padding-bottom:calc(2rem + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit}
button,input{font:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
.wrap{width:min(92%,960px);margin:auto}
[hidden]{display:none!important}
.top{position:fixed;inset:0 0 auto;z-index:50;height:calc(var(--h) + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);transition:height .25s}
.top.sm{height:calc(var(--hs) + env(safe-area-inset-top))}
body{padding-top:calc(var(--h) + env(safe-area-inset-top))}
.top .wrap{height:100%;display:flex;align-items:center;gap:.7rem}
.top img{width:40px;height:40px;border-radius:10px;flex:none;transition:width .25s,height .25s}
.top.sm img{width:32px;height:32px}
.ttl{flex:1;min-width:0;line-height:1.2}
.top h1{font-size:1.1rem;font-weight:700;color:var(--ink);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .tag{font-size:.8rem;max-height:1.2rem;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;transition:max-height .2s,opacity .2s}
.top.sm .tag{max-height:0;opacity:0}
.status{display:inline-flex;gap:.45rem;align-items:center;flex:none;font-size:.8rem;font-weight:500;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:99px;padding:.3rem .75rem}
.status i{width:8px;height:8px;border-radius:50%;background:#aab3a8;flex:none}.status.on i{background:#2e9e4f;box-shadow:0 0 0 3px #d6f0dd}
@media(max-width:480px){.status{padding:.3rem .6rem}.status span{font-size:0}.status span::after{content:attr(data-s);font-size:.78rem}}
.noticebar{position:fixed;top:calc(var(--h) + env(safe-area-inset-top));left:0;right:0;z-index:40;min-height:40px;display:flex;align-items:center;justify-content:center;background:var(--ink);color:#fff;font-weight:500;font-size:.9rem;text-align:center;padding:.4rem .8rem}
.top.sm ~ .noticebar{top:calc(var(--hs) + env(safe-area-inset-top))}
body.has-notice{padding-top:calc(var(--h) + 40px + env(safe-area-inset-top))}
.offer{display:none;margin:1rem auto 0;width:min(92%,960px);padding:1rem 1.2rem;background:#fff;border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:var(--r);color:var(--ink);text-decoration:none}
.offer.show{display:block}
.offer .k{font-weight:600;font-size:.92rem}
.offer .pr{display:flex;gap:2rem;margin-top:.4rem}
.offer .pr div{display:grid;line-height:1.2}.offer small{font-size:.82rem;color:var(--text)}.offer s{font-size:.85rem;color:#8a948b}.offer b{font-size:1.5rem;color:var(--brand)}
.tools{padding-top:1rem}
.find{width:100%;min-height:50px;padding:.65rem 1.1rem;border:1px solid #cfd8cb;border-radius:var(--r);background:#fff;color:var(--ink)}
.find:focus{border-color:var(--brand);outline:3px solid var(--brand-l)}
.legend{display:flex;flex-wrap:wrap;gap:.3rem 1rem;margin-top:.7rem;font-size:.88rem}
.legend span{display:inline-flex;align-items:center;gap:.4rem}
.diet{width:14px;height:14px;border:1.5px solid currentColor;display:inline-grid;place-items:center;flex:none;border-radius:3px}
.diet i{width:7px;height:7px;border-radius:50%;background:currentColor}
.diet.veg{color:#1f7a34}.diet.nonveg{color:#b42318}
.lead{font-size:1.35rem;font-weight:700;color:var(--ink);letter-spacing:-.02em;margin:1.4rem 0 .9rem}
.sub{font-size:.95rem;margin-bottom:1rem}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
@media(min-width:700px){.tiles{grid-template-columns:repeat(3,1fr);gap:1.1rem}}
.tile{position:relative;display:block;aspect-ratio:4/5;border-radius:20px;overflow:hidden;text-decoration:none;background:var(--brand);color:#fff;isolation:isolate}
.tile .ic{position:absolute;inset:0;display:grid;place-items:center;font-size:3rem;z-index:-3;opacity:.4}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.tile::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,rgba(10,16,10,.94) 0,rgba(10,16,10,.82) 22%,rgba(10,16,10,.45) 42%,rgba(10,16,10,0) 65%)}
.tile span{position:absolute;left:1rem;right:1rem;bottom:.9rem;display:grid;line-height:1.2}
.tile b{font-size:1.3rem;font-weight:700}.tile small{color:#e6efdf;font-size:.88rem;margin-top:.1rem}
.tile:active{transform:scale(.98)}
.back{display:flex;width:fit-content;align-items:center;min-height:44px;font-weight:600;font-size:.95rem;color:var(--brand);text-decoration:none}
.back.top2{margin:.1rem 0 .4rem}.back.end{margin:1.4rem 0 .2rem}
.pills{position:sticky;top:calc(var(--hs) + env(safe-area-inset-top));z-index:20;background:var(--soft);border-bottom:1px solid var(--line)}
body.has-notice .pills{top:calc(var(--hs) + 40px + env(safe-area-inset-top))}
.pills .in{display:flex;gap:.5rem;overflow-x:auto;padding:.7rem 4%;scrollbar-width:none}
.pills .in::-webkit-scrollbar{display:none}
.pill{flex:none;min-height:42px;display:inline-flex;align-items:center;gap:.4rem;padding:0 1rem;border-radius:99px;border:1px solid #cfd8cb;background:#fff;color:var(--ink);font-weight:500;font-size:.92rem;text-decoration:none}
.pill[aria-current=true]{background:var(--brand);border-color:var(--brand);color:#fff}
#body{padding-top:.5rem}
#body.in{animation:fin .2s ease}
@keyframes fin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.tagh{font-size:1.15rem;font-weight:700;color:var(--ink);letter-spacing:-.01em;margin:0 0 .7rem;padding-bottom:.5rem;border-bottom:2px solid var(--brand);width:fit-content}
.grid+.tagh{margin-top:1.6rem}
.hint{background:var(--amber);color:var(--ink);font-weight:500;font-size:.92rem;padding:.7rem 1rem;border-radius:var(--r);margin-bottom:.9rem}
.grid{display:grid;gap:.7rem}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr;gap:.8rem}}
.card{display:grid;grid-template-columns:88px 1fr;gap:.9rem;align-items:center;background:#fff;border-radius:var(--r);padding:.65rem;border:1px solid var(--line)}
.card.hot{background:#FFF9E3;border-color:var(--amber)}
.ph{width:88px;height:88px;border-radius:10px;overflow:hidden;background:var(--brand-l);display:grid;place-items:center;font-size:2.2rem}
.ph img{width:100%;height:100%;object-fit:cover}
.bd{display:grid;gap:.15rem;min-width:0}
.nm{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem;font-weight:600;color:var(--ink);font-size:1.05rem;line-height:1.25}
.pick{font-size:.7rem;font-weight:600;background:var(--amber);color:var(--ink);padding:.1rem .55rem;border-radius:99px;white-space:nowrap}
.ds{font-size:.88rem;line-height:1.4}
.pc{font-weight:700;color:var(--brand);font-size:1.1rem;margin-top:.2rem}
.card.hot .pc{color:var(--ink)}
.pc s{color:#8a948b;font-weight:400;font-size:.9rem;margin-right:.4rem}
.where{font-size:.78rem;color:var(--text)}
.info{margin:2rem auto 0}
.wifi{background:var(--brand-l);padding:.8rem 1rem;border-radius:var(--r);font-weight:500;font-size:.92rem;color:var(--brand-d)}
.foot{text-align:center;padding:1.4rem 0 1rem;font-size:.92rem}
.foot a,.foot button{display:inline-block;margin:.2rem .6rem;color:var(--brand);font-weight:600;background:none;border:0;cursor:pointer;padding:0}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

*{-webkit-tap-highlight-color:transparent}
a,button,.card,.tile,.pill{touch-action:manipulation}
.find{font-size:16px}
.pill{min-height:44px}
@media(max-width:600px){.offer .pr{gap:1.4rem}.lead{font-size:1.25rem}}
@media(max-width:380px){.card{grid-template-columns:76px 1fr;gap:.7rem}.ph{width:76px;height:76px}.nm{font-size:1rem}.tile b{font-size:1.1rem}.tile small{font-size:.8rem}.top h1{font-size:1rem}.top .tag{display:none}.tiles{gap:.7rem}}
@media(max-height:480px) and (orientation:landscape){.tiles{grid-template-columns:repeat(3,1fr)}.tile{aspect-ratio:4/3}.top{position:absolute}.pills{top:0}}
</style>
</head>
<body>
<header class="top" id="top"><div class="wrap">
<img src="images/logo.JPG" alt="Chautari Tea House logo" width="44" height="44">
<div class="ttl"><h1>Chautari Tea House</h1><p class="tag">Where every cup tells a story.</p></div>
<div class="status" id="status"><i></i><span>Open daily 7 AM to 9 PM</span></div>
</div></header>
<div class="noticebar" id="promo" hidden></div>

<a class="offer" id="offer" href="#hookah">
<span class="k" id="ok">Hookah offer on now</span>
<div class="pr"><div><small id="on1">Normal hookah</small><s id="os1">Rs. 350</s><b id="op1">Rs. 175</b></div><div><small id="on2">Kaloud hookah</small><s id="os2">Rs. 499</s><b id="op2">Rs. 250</b></div></div>
</a>

<div class="wrap tools">
<input class="find" id="find" type="search" placeholder="Search chai, momos, fries" enterkeyhint="search" autocomplete="off">
</div>

<main class="wrap" id="home">
<h2 class="lead">Our menu</h2>
<div class="tiles" id="tiles"></div>
</main>

<div class="wrap" id="results" hidden>
<h2 class="lead">Matching dishes</h2>
<div class="grid" id="resultgrid"></div>
</div>

<div id="cat" hidden>
<nav class="pills" aria-label="Menu categories"><div class="in" id="pills"></div></nav>
<main class="wrap" id="body"></main>
</div>

<div class="wrap info">
<div class="wifi">Wi-Fi: ask us at the counter, or scan the QR code on the printed menu.</div>
<div class="foot"><a href="index.html">Website</a><a href="https://www.instagram.com/chautariteahouse/" target="_blank" rel="noopener">Instagram</a><a href="https://www.facebook.com/chautariteahouse" target="_blank" rel="noopener">Facebook</a><a href="https://www.tiktok.com/@chautariteahouse" target="_blank" rel="noopener">TikTok</a><button type="button" id="install" hidden>Add to home screen</button></div>
</div>

<script src="menu-data.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
function diet(item){if(item.diet!=="veg"&&item.diet!=="nonveg")return "";const name=item.diet==="veg"?CH.ui("veg"):CH.ui("nonveg");return `<i class="diet ${item.diet}" title="${esc(name)}" aria-label="${esc(name)}"><i></i></i>`}
function fillPhoto(box,src){const im=new Image();im.alt="";im.onload=()=>{box.textContent="";box.append(im)};im.src=src}
function card(item){
  const p=CH.price(item),hot=p!==item.price,name=item.en,desc=item.descEn||"";
  const c=document.createElement("div"); c.className="card"+(hot?" hot":"");
  c.innerHTML=`<div class="ph">${CH.sectionById(item.sectionId).emoji}</div><div class="bd"><div class="nm">${diet(item)}${esc(name)}${item.pick?`<span class="pick">${esc(CH.ui("pick"))}</span>`:""}</div>${desc?`<div class="ds">${esc(desc)}</div>`:""}<div class="pc">${hot?`<s>${CH.money(item.price)}</s>`:""}${CH.money(p)}</div></div>`;
  fillPhoto(c.querySelector(".ph"), CH.photo(item));
  return c;
}
function renderOffer(){
  const on=CH.offerOn(); $("#offer").classList.toggle("show",on); $("#ok").textContent=CH.ui("offerKicker");
  [["hukka-normal","on1","os1","op1"],["hukka-kaloud","on2","os2","op2"]].forEach(([id,n,s,p])=>{const item=CH.find(id);$("#"+n).textContent=item.en;$("#"+s).textContent=CH.money(item.price);$("#"+p).textContent=CH.money(item.offer)});
}
function renderTiles(){
  const box=$("#tiles"); box.innerHTML="";
  CH.tabs.forEach(tab=>{
    const a=document.createElement("a"); a.className="tile"; a.href="#"+tab.id;
    a.innerHTML=`<div class="ic">${tab.emoji}</div><span><b>${esc(tab.en)}</b><small>${esc(tab.subEn)}</small></span>`;
    const im=new Image(); const srcs=["images/tab-"+tab.id+".jpg","images/tab-"+tab.id+".png","images/menu/tab-"+tab.id+".jpg"]; let k=0;
    im.alt=""; im.onload=()=>a.prepend(im); im.onerror=()=>{if(++k<srcs.length)im.src=srcs[k]}; im.src=srcs[0];
    box.append(a);
  });
}
function back(cls){const a=document.createElement("a");a.className="back "+cls;a.href="#";a.innerHTML=`<span aria-hidden="true">&larr;</span>&nbsp;`;a.append(document.createTextNode(CH.ui("allCategories")));return a}
function render(tabId){
  const tab=CH.tabs.find(t=>t.id===tabId); if(!tab)return;
  const pills=$("#pills"); pills.innerHTML=CH.tabs.map(t=>`<a class="pill" href="#${t.id}"${t.id===tab.id?' aria-current="true"':""}>${t.emoji} ${esc(t.en)}</a>`).join("");
  const cur=pills.querySelector("[aria-current]"); if(cur)pills.scrollLeft=cur.offsetLeft-(pills.clientWidth-cur.offsetWidth)/2;
  const b=$("#body"); b.innerHTML=""; b.classList.remove("in"); void b.offsetWidth; b.classList.add("in");
  b.append(back("top2"));
  if(tab.id==="hookah"){const h=document.createElement("div");h.className="hint";h.textContent=CH.offerOn()?CH.ui("hkOn"):CH.ui("hkOff");b.append(h)}
  CH.sections.filter(s=>s.tab===tab.id).forEach(section=>{
    const groups=section.groups||[{en:section.en,ne:section.ne,items:section.items,solo:CH.sections.filter(s=>s.tab===tab.id).length===1}];
    groups.forEach(g=>{
      if(!(g.solo&&CH.sections.filter(s=>s.tab===tab.id).length===1)){const h=document.createElement("h2");h.className="tagh";h.textContent=g.en;b.append(h)}
      const grid=document.createElement("div"); grid.className="grid";
      g.items.forEach(item=>grid.append(card(item)));
      b.append(grid);
    });
  });
  b.append(back("end"));
}
function showResults(q){
  const items=CH.search(q);
  $("#home").hidden=true; $("#cat").hidden=true; $("#results").hidden=false;
  const g=$("#resultgrid"); g.innerHTML="";
  if(!items.length){const p=document.createElement("p");p.textContent=CH.ui("nothing");g.append(p);return}
  items.forEach(item=>{
    const wrap=card(item);
    const where=document.createElement("div"); where.className="where"; where.textContent=CH.placeName(item);
    wrap.querySelector(".bd").prepend(where);
    g.append(wrap);
  });
}
function route(){
  const id=location.hash.slice(1), tab=CH.tabs.find(t=>t.id===id);
  const q=$("#find").value.trim();
  if(q){showResults(q);return}
  $("#results").hidden=true; $("#home").hidden=!!tab; $("#cat").hidden=!tab;
  if(tab){render(tab.id);scrollTo(0,0)}
}
(()=>{const hd=$("#top");let sm=false;addEventListener("scroll",()=>{const y=scrollY;if(!sm&&y>12){sm=true;hd.classList.add("sm")}else if(sm&&y<4){sm=false;hd.classList.remove("sm")}},{passive:true})})();
(()=>{let x0,y0,ok=false;const c=$("#cat");
  c.addEventListener("touchstart",e=>{ok=!e.target.closest(".pills");x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
  c.addEventListener("touchend",e=>{if(!ok)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;
    if(Math.abs(dx)<70||Math.abs(dy)>Math.abs(dx)*.6)return;
    const i=CH.tabs.findIndex(t=>t.id===location.hash.slice(1)), n=i+(dx<0?1:-1);
    if(n<0)location.hash=""; else if(n<CH.tabs.length)location.hash=CH.tabs[n].id;
  },{passive:true});
})();
$("#find").addEventListener("input",route);
addEventListener("hashchange",()=>{$("#find").value="";route()});
CH.mountNotice();CH.paintStatus();renderOffer();renderTiles();route();
</script>
</body>
</html>
